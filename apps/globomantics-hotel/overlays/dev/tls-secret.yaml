apiVersion: v1
kind: Secret
metadata:
  name: guestbook-tls-secret
type: kubernetes.io/tls
data:
  # Replace these with your actual base64-encoded certificate and key
  # To generate: cat tls.crt | base64 -w 0
  # To generate: cat tls.key | base64 -w 0
  # Example: echo -n "your-cert-content" | base64
  tls.crt:   # Replace with base64-encoded certificate
  tls.key:   # Replace with base64-encoded private key

