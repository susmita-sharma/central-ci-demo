apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guestbook-guestbook-ingress
  annotations:
  #   # Traefik annotations
  #   traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  #   # Nginx SSL redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx  # Override default nginx if needed; traefik
  rules:
  - host: guestbook.frontend.deepak.hotel
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: guestbook-frontend
            port:
              number: 80
  - host: guestbook.backend.deepak.hotel
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: guestbook-backend
            port:
              number: 80
  tls:
    - hosts:
        - guestbook.frontend.deepak.hotel
        - guestbook.backend.deepak.hotel
      secretName: guestbook-tls-secret

