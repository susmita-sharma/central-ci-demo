apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: globomantics-hotel-dev

resources:
- ../../base
- namespace.yaml
- tls-secret.yaml

patchesStrategicMerge:
- patches/ingress.yaml
- patches/configmap.yaml
- patches/namespace.yaml
- patches/frontend-deployment.yaml
- patches/backend-deployment.yaml

images:
- name: openlabfree/globomantics-be:v7
